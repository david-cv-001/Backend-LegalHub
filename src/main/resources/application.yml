spring:
  application:
    name: legalhub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/legalhub}
    username: ${DB_USERNAME:legalhub}
    password: ${DB_PASSWORD:legalhub}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-use-32-bytes-minimum}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
  superadmin:
    username: ${SUPERADMIN_USERNAME:admin@unsis.com}
    password: ${SUPERADMIN_PASSWORD:admin123}
    sync-password: ${SUPERADMIN_SYNC_PASSWORD:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
