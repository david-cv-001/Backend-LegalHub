services:
  postgres:
    image: postgres:16-alpine
    container_name: legalhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-legalhub}
      POSTGRES_USER: ${DB_USERNAME:-legalhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-legalhub}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - legalhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-legalhub} -d ${DB_NAME:-legalhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  legalhub_pgdata:
